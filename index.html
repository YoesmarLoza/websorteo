<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Aleatorio de Ganadores</title>
    <!-- CDN oficial de Bootstrap 5.3.8 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-4">

    <!-- Contenedor principal responsivo -->
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Tarjeta principal -->
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    
                    <!-- Encabezado de la tarjeta -->
                    <div class="bg-gradient bg-primary text-white text-center p-4">
                        <h1 class="h4 fw-bold mb-1"><i class="bi bi-trophy-fill text-warning me-2"></i>Sorteador Aleatorio</h1>
                        <p class="small mb-0 opacity-75">Elige ganadores de forma justa y emocionante</p>
                    </div>

                    <!-- Cuerpo de la tarjeta -->
                    <div class="card-body p-4">

                        <!-- PASO 1: Ingreso de Participantes -->
                        <div class="mb-4">
                            <label for="listaParticipantes" class="form-label fw-semibold">
                                <i class="bi bi-people-fill me-1 text-primary"></i> Ingresa los nombres (uno por línea o separados por coma):
                            </label>
                            <textarea 
                                id="listaParticipantes" 
                                class="form-control" 
                                rows="4" 
                                placeholder="Ej:&#10;Ana Gómez&#10;Carlos Ruiz&#10;María Pérez&#10;Juan Torres"
                            ></textarea>
                            <div class="form-text text-muted small mt-1">
                                Participantes detectados: <span id="contadorParticipantes" class="fw-bold text-dark">0</span>
                            </div>
                        </div>

                        <!-- PASO 2: Selección de Cantidad de Ganadores -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold d-block">
                                <i class="bi bi-award-fill me-1 text-warning"></i> Cantidad de ganadores a sortear:
                            </label>
                            <div class="btn-group w-100" role="group" aria-label="Cantidad de ganadores">
                                <input type="radio" class="btn-check" name="numGanadores" id="ganadores1" value="1" autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="ganadores1">1</label>

                                <input type="radio" class="btn-check" name="numGanadores" id="ganadores2" value="2" autocomplete="off">
                                <label class="btn btn-outline-primary" for="ganadores2">2</label>

                                <input type="radio" class="btn-check" name="numGanadores" id="ganadores3" value="3" autocomplete="off">
                                <label class="btn btn-outline-primary" for="ganadores3">3</label>

                                <input type="radio" class="btn-check" name="numGanadores" id="ganadores4" value="4" autocomplete="off">
                                <label class="btn btn-outline-primary" for="ganadores4">4</label>

                                <input type="radio" class="btn-check" name="numGanadores" id="ganadores5" value="5" autocomplete="off">
                                <label class="btn btn-outline-primary" for="ganadores5">5</label>
                            </div>
                        </div>

                        <!-- Botón de Sorteo -->
                        <div class="d-grid mb-4">
                            <button id="btnSortear" class="btn btn-primary btn-lg fw-bold shadow-sm py-3">
                                <i class="bi bi-shuffle me-2"></i> ¡Realizar Sorteo!
                            </button>
                        </div>

                        <!-- Sección de Resultados -->
                        <div id="seccionResultados" class="d-none">
                            <hr class="my-4 text-secondary opacity-25">
                            <div class="alert bg-warning-subtle border-warning-subtle text-warning-emphasis rounded-3 p-4 text-center">
                                <h4 class="alert-heading fw-bold fs-5 mb-3">
                                    <i class="bi bi-stars me-1"></i> ¡Felicitaciones a los Ganadores! <i class="bi bi-stars ms-1"></i>
                                </h4>
                                <ul id="listaGanadores" class="list-unstyled mb-0 fs-5 fw-semibold">
                                    <!-- Los ganadores se inyectarán aquí dinámicamente -->
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- CDN oficial de Bootstrap 5.3.8 (JS Bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica de Sorteo Aleatorio -->
    <script>
        const textareaParticipantes = document.getElementById('listaParticipantes');
        const contadorParticipantes = document.getElementById('contadorParticipantes');
        const btnSortear = document.getElementById('btnSortear');
        const seccionResultados = document.getElementById('seccionResultados');
        const listaGanadores = document.getElementById('listaGanadores');

        // Función auxiliar para obtener la lista limpia de participantes
        function obtenerParticipantes() {
            const texto = textareaParticipantes.value;
            // Separa por saltos de línea o comas, elimina espacios vacíos y filtra nombres nulos
            return texto
                .split(/[\n,]/)
                .map(nombre => nombre.trim())
                .filter(nombre => nombre.length > 0);
        }

        // Actualizar contador en tiempo real al escribir
        textareaParticipantes.addEventListener('input', () => {
            const participantes = obtenerParticipantes();
            contadorParticipantes.textContent = participantes.length;
        });

        // Lógica principal del sorteo
        btnSortear.addEventListener('click', () => {
            const participantes = obtenerParticipantes();
            
            // Validar que existan participantes
            if (participantes.length === 0) {
                alert('Por favor, ingresa al menos un participante.');
                return;
            }

            // Obtener la cantidad de ganadores seleccionados (1 a 5)
            const cantidadSeleccionada = parseInt(document.querySelector('input[name="numGanadores"]:checked').value);

            // Validar que no se pidan más ganadores de los participantes disponibles
            if (cantidadSeleccionada > participantes.length) {
                alert(`Has seleccionado ${cantidadSeleccionada} ganadores, pero solo hay ${participantes.length} participantes.`);
                return;
            }

            // Deshabilitar botón durante el efecto visual
            btnSortear.disabled = true;
            btnSortear.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Sorteando...';
            seccionResultados.classList.add('d-none');

            // Simulación de animación de mezcla (efecto de suspenso por 1 segundo)
            setTimeout(() => {
                // Algoritmo de mezcla aleatoria (Fisher-Yates)
                let mezcla = [...participantes];
                for (let i = mezcla.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [mezcla[i], mezcla[j]] = [mezcla[j], mezcla[i]];
                }

                // Seleccionar los primeros N ganadores
                const ganadores = mezcla.slice(0, cantidadSeleccionada);

                // Mostrar resultados en pantalla
                listaGanadores.innerHTML = '';
                ganadores.forEach((ganador, index) => {
                    const li = document.createElement('li');
                    li.className = 'py-2 border-bottom border-warning-subtle last-border-0';
                    li.innerHTML = `<span class="badge bg-warning text-dark me-2">#${index + 1}</span> ${ganador}`;
                    listaGanadores.appendChild(li);
                });

                seccionResultados.classList.remove('d-none');

                // Restaurar botón
                btnSortear.disabled = false;
                btnSortear.innerHTML = '<i class="bi bi-shuffle me-2"></i> ¡Realizar Sorteo!';
            }, 1000);
        });
    </script>
</body>
</html>
